services:
  db:
    image: postgres:16
    container_name: asset-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_app
      POSTGRES_PASSWORD: asset_app_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_app -d asset_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
